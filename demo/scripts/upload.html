<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Team Data</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1f2a37;--muted:#5f6875;--line:#e4dfd5;--accent:#b45309;--tint:#fdf1e0;--ok:#166534;--okbg:#dcfce7;--bad:#991b1b;--badbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px 64px}
h1{font:700 34px/1.15 Georgia,serif;margin:0 0 8px}
.lede{color:var(--muted);margin:0 0 20px}
.summary{background:var(--tint);border-radius:8px;padding:12px 14px;margin-bottom:20px;font-weight:600}
.slot{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.slot.drag{border-color:var(--accent);background:var(--tint)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h2{font-size:17px;margin:0}
.meta,.hint,.cols{font-size:14px;color:var(--muted);margin:3px 0 0}
.cols{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;word-break:break-word}
.badge{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.yours{background:var(--okbg);color:var(--ok)}
.demo{background:var(--tint);color:var(--accent)}
.missing{background:var(--badbg);color:var(--bad)}
label.pick{display:inline-block;margin-top:10px;padding:7px 13px;border:1px solid var(--ink);border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
label.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
.result{font-size:14px;margin:8px 0 0}
.result.good{color:var(--ok)}
.result.err{color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Agent team data</h1>
<p class="lede">Add your files here. Drag them onto a box or choose them. Everything stays on this computer.</p>
<div class="summary" id="summary">Checking setup</div>
<div id="slots"></div>
</main>
<script>
const LABELS = { yours: "Your data", demo: "Demo data", missing: "Missing" };

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function sendFile(key, file) {
  const url = `/upload?type=${encodeURIComponent(key)}&name=${encodeURIComponent(file.name)}`;
  const res = await fetch(url, { method: "POST", headers: { "X-Agent-Upload": "1" }, body: file });
  const data = await res.json();
  return { ok: res.ok, message: `${file.name}: ${data.message}` };
}

async function handleFiles(key, files) {
  const results = [];
  for (const file of files) results.push(await sendFile(key, file));
  await render();
  const box = document.getElementById(`result-${key}`);
  box.replaceChildren(...results.map(r => el("div", r.ok ? "result good" : "result err", r.message)));
  return results;
}

async function render() {
  const report = await (await fetch("/status")).json();
  const counts = { yours: 0, demo: 0, missing: 0 };
  const list = document.getElementById("slots");
  const kept = {};
  list.querySelectorAll("[id^=result-]").forEach(n => { kept[n.id] = [...n.childNodes]; });
  list.replaceChildren();
  for (const slot of report.slots) {
    counts[slot.state]++;
    const box = el("section", "slot");
    const top = el("div", "top");
    const left = el("div");
    left.append(el("h2", "", slot.label));
    const size = slot.rows !== null ? `${slot.rows} rows` : `${slot.files} files`;
    left.append(el("p", "meta", `${slot.used_by}, ${size}${slot.updated ? `, updated ${slot.updated}` : ""}`));
    top.append(left, el("span", `badge ${slot.state}`, LABELS[slot.state]));
    box.append(top, el("p", "hint", slot.hint));
    if (slot.columns.length) box.append(el("p", "cols", slot.columns.join(", ")));
    if (slot.missing.length) box.append(el("p", "result err", `Missing: ${slot.missing.join(", ")}`));
    const pick = el("label", "pick", "Choose files");
    const input = el("input");
    input.type = "file";
    input.multiple = true;
    input.accept = slot.ext.join(",");
    input.setAttribute("aria-label", `Choose files for ${slot.label}`);
    input.addEventListener("change", () => handleFiles(slot.key, [...input.files]));
    pick.append(input);
    const result = el("div");
    result.id = `result-${slot.key}`;
    if (kept[result.id]) result.append(...kept[result.id]);
    box.append(pick, result);
    box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("drag"); });
    box.addEventListener("dragleave", () => box.classList.remove("drag"));
    box.addEventListener("drop", e => {
      e.preventDefault();
      box.classList.remove("drag");
      handleFiles(slot.key, [...e.dataTransfer.files]);
    });
    list.append(box);
  }
  const total = report.slots.length;
  const agents = report.agents === 8 ? "All 8 agent instruction files are in place." : `Only ${report.agents} of 8 agent instruction files found.`;
  document.getElementById("summary").textContent =
    `${counts.yours} of ${total} data areas hold your data, ${counts.demo} still hold demo data, ${counts.missing} missing. ${agents}`;
}

render();
</script>
</body>
</html>
